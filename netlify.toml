# Netlify Configuration for Vaishnavi Luxury Ladies PG
[build]
  command = "npm run build"
  publish = "dist"

# Single-Page App redirect for clean routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Best Practice Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache hashed Vite assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images for 30 days
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
